name: CI

on:
  push:
    paths: ["cpu/**", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install "./cpu[test]"
      - name: Unit tests and accuracy regression
        run: pytest -q cpu/tests
      - name: Self-test via the installed command
        run: archaemetry selftest --full -o selftest-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.os }}-py${{ matrix.python }}
          path: selftest-out/**/*_drawing.png
